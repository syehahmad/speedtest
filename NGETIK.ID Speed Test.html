<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGETIK.ID – Internet Speed Test</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#12201b;--mute:#62736c;--line:#dbe4df;--acc:#0a8f6a;--acc2:#12c48b;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1512;--card:#14201b;--ink:#e8f2ed;--mute:#8aa096;--line:#243630;--acc:#19c795;--acc2:#5ff0be;--btn-ink:#06130e}}
:root[data-theme="dark"]{--bg:#0d1512;--card:#14201b;--ink:#e8f2ed;--mute:#8aa096;--line:#243630;--acc:#19c795;--acc2:#5ff0be;--btn-ink:#06130e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;align-self:flex-start;margin-top:4vh}
.brand{font-weight:800;letter-spacing:.04em;font-size:20px}
.brand b{color:var(--acc)}
.sub{color:var(--mute);margin:4px 0 18px;font-size:15px}
.gauge{position:relative;width:260px;max-width:100%;margin:0 auto}
.gauge svg{width:100%;display:block}
.track,.fill{fill:none;stroke-width:14;stroke-linecap:round}
.track{stroke:var(--line)}
.fill{stroke:url(#g);stroke-dasharray:0 100;transition:stroke-dasharray .25s linear}
.needle{transform-origin:130px 130px;transition:transform .25s linear}
.read{margin-top:-34px;position:relative}
.num{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.unit{color:var(--mute);font-size:14px;margin-top:2px}
.stage{min-height:176px;margin-top:18px;position:relative}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s}
.pane.on{opacity:1;visibility:visible}
.steps{list-style:none;margin:0;padding:6px 0 0;text-align:left;display:inline-block}
.steps li{padding:5px 0;color:var(--mute);font-size:15px;opacity:.5;transition:opacity .3s,color .3s}
.steps li.act{opacity:1;color:var(--ink);font-weight:600}
.steps li.act::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:10px;animation:p 1s infinite}
.steps li.done{opacity:.9}
.steps li.done::before{content:"✓";color:var(--acc);margin-right:10px;font-weight:700}
.steps li:not(.act):not(.done)::before{content:"";display:inline-block;width:8px;margin-right:10px}
@keyframes p{50%{opacity:.25}}
.rtitle{font-weight:700;font-size:13px;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--bg);border-radius:12px;padding:10px 6px}
.cell small{display:block;color:var(--mute);font-size:12px}
.cell strong{font-size:18px;font-variant-numeric:tabular-nums}
.server{margin-top:12px;font-size:13px;color:var(--mute)}
.server b{display:block;color:var(--ink);font-size:14px}
.ok{margin-top:8px;font-size:13px;color:var(--acc);font-weight:600}
.btn{margin-top:20px;width:100%;border:0;border-radius:14px;padding:16px;font:700 16px/1 inherit;font-family:inherit;letter-spacing:.06em;color:var(--btn-ink);background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:progress}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stage.res{min-height:260px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand">NGETIK<b>.ID</b></div>
  <div class="sub">Internet Speed Test</div>

  <div class="gauge">
    <svg viewBox="0 0 260 160" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0a8f6a"/><stop offset="1" stop-color="#5ff0be"/></linearGradient></defs>
      <path class="track" pathLength="100" d="M 20 130 A 110 110 0 0 1 240 130"/>
      <path class="fill" id="fill" pathLength="100" d="M 20 130 A 110 110 0 0 1 240 130"/>
      <g class="needle" id="needle" style="transform:rotate(-90deg)"><line x1="130" y1="130" x2="130" y2="42" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="130" r="7" fill="currentColor"/></g>
    </svg>
    <div class="read"><div class="num" id="num">0.00</div><div class="unit">Mbps</div></div>
  </div>

  <div class="stage" id="stage">
    <div class="pane on" id="p-idle"></div>
    <div class="pane" id="p-test"><ul class="steps" id="steps">
      <li>Finding fastest server...</li><li>Ping test...</li><li>Download test...</li><li>Upload test...</li><li>Calculating result...</li>
    </ul></div>
    <div class="pane" id="p-res">
      <div class="rtitle" id="rtitle">YOUR RESULT</div>
      <div class="grid">
        <div class="cell"><small>Download</small><strong id="r-dl">–</strong></div>
        <div class="cell"><small>Upload</small><strong id="r-ul">–</strong></div>
        <div class="cell"><small>Ping</small><strong id="r-pg">–</strong></div>
        <div class="cell"><small>Jitter</small><strong id="r-jt">–</strong></div>
      </div>
      <div class="server">Server<b>Putra Tunggal.net</b>Banjarnegara, Jawa Tengah</div>
      <div class="ok" id="ok">● Test Complete</div>
    </div>
  </div>

  <button class="btn" id="btn">START TEST</button>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY="ngetik_last_result", MAX=100;
  var btn=$("btn"), stage=$("stage"), busy=false;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  var rnd=function(a,b){return a+Math.random()*(b-a)};

  function show(id){
    ["p-idle","p-test","p-res"].forEach(function(p){$(p).classList.toggle("on",p===id)});
    stage.classList.toggle("res",id==="p-res");
  }
  function gauge(v){
    var pct=Math.min(v/MAX,1);
    $("num").textContent=v.toFixed(2);
    $("fill").style.strokeDasharray=(pct*100)+" 100";
    $("needle").style.transform="rotate("+(-90+pct*180)+"deg)";
  }
  function setStep(n){
    var li=$("steps").children;
    for(var i=0;i<li.length;i++){li[i].className=i<n?"done":(i===n?"act":"")}
  }
  // Animasi gauge menuju target selama ms milidetik, dengan sedikit fluktuasi
  async function ramp(target,ms){
    var t0=performance.now(), v;
    while(true){
      var k=Math.min((performance.now()-t0)/ms,1);
      v=target*(1-Math.pow(1-k,2))*(k<1?rnd(.92,1.06):1);
      gauge(Math.max(0,v));
      if(k>=1)break;
      await wait(60);
    }
    gauge(target);
  }

  // GANTI fungsi ini dengan pengukuran nyata (fetch ke endpoint server milikmu)
  async function measure(){
    var res={ping:Math.round(rnd(10,35)),jitter:Math.round(rnd(1,8)),dl:+rnd(20,90).toFixed(2),ul:+rnd(5,25).toFixed(2)};
    setStep(0); await wait(1300);
    setStep(1); await ramp(0,1); await wait(1200);
    setStep(2); await ramp(res.dl,3600);
    setStep(3); gauge(0); await wait(250); await ramp(res.ul,3000);
    setStep(4); await wait(1000);
    return res;
  }

  function fill(r,title,complete){
    $("rtitle").textContent=title;
    $("r-dl").textContent=r.dl.toFixed(2)+" Mbps";
    $("r-ul").textContent=r.ul.toFixed(2)+" Mbps";
    $("r-pg").textContent=r.ping+" ms";
    $("r-jt").textContent=r.jitter+" ms";
    $("ok").style.display=complete?"block":"none";
    gauge(r.dl);
  }

  async function run(){
    if(busy)return; busy=true;
    btn.textContent="TESTING..."; btn.disabled=true;
    gauge(0); setStep(-1); show("p-test");
    var r=await measure();
    try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}
    fill(r,"YOUR RESULT",true);
    show("p-res");
    btn.textContent="TEST AGAIN"; btn.disabled=false; busy=false;
  }
  btn.addEventListener("click",run);

  // Hasil terakhir (jika ada)
  try{
    var s=localStorage.getItem(KEY);
    if(s){var r=JSON.parse(s); if(r&&typeof r.dl==="number"){fill(r,"LAST RESULT",false); show("p-res"); btn.textContent="TEST AGAIN";}}
  }catch(e){}
})();
</script>
</body>
</html>
